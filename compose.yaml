services:
  dotpress:
    build: .
    image: solo17-dotpress:1.0
    ports:
      - "127.0.0.1:18917:18917"
    environment:
      DOTPRESS_DATA_DIR: /data
      PORT: 18917
    volumes:
      - dotpress-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18917/press/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  dotpress-data:
